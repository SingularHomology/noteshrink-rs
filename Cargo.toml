[package]
name = "noteshrink-rs"
version = "0.1.0"
authors = ["Oussama Moutaoikil <m.oussama@proton.me>"]
description = "Convert handwritten notes to beautiful, compact PDFs."
repository = "https://github.com/SingularHomology/noteshrink-rs.git"
readme = "README.md"
license = "MIT"
edition = "2021"

[dependencies]
ndarray = "0.16.1"
nshare = "0.10.0"
image = "0.25.10"
rand = "0.9.1"
clap = { version = "4.6.7", features = ["derive"] }
kmeans = "2.0.2"
indicatif = "0.18.6"
colored = "3.1.1"
exec_time = "0.1.7"

