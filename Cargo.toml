[package]
name = "noteshrink-rs"
version = "0.2.1"
authors = ["Oussama Moutaoikil <m.oussama@proton.me>"]
description = "Convert scanned, handwritten notes to compact, beautiful images and PDFs."
repository = "https://github.com/singularhomology/noteshrink-rs.git"
readme = "README.md"
license = "MIT"
edition = "2021"
keywords = ["image-processing", "notes", "scan", "quantization", "pdf"]
categories = ["command-line-utilities", "multimedia::images"]

[lib]
name = "noteshrink_rs"
path = "src/lib.rs"

[[bin]]
name = "noteshrink-rs"
path = "src/main.rs"

[dependencies]
ndarray = "0.17.2"
image = "0.25.10"
rand = "0.10.2"
clap = { version = "4.6.7", features = ["derive"] }
kmeans_colors = "0.7.1"
palette = "0.7.7"
indicatif = "0.18.6"
colored = "3.1.1"
rayon = "1.12"
png = "0.18.1"
pdf-writer = "0.15"
miniz_oxide = "0.9"
